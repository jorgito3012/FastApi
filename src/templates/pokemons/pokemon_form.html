{%extends "fragments/base.html" %}

{% block content %}

<div class="form-container">
    <h1>📝 Nuevo Pokemon</h1>
    <form method="post" action="/pokemons/new" enctype="application/x-www-form-urlencoded">
        <div class="form-group">
            <label for="nombre">Nombre del Pokemon:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce el nombre" required>
        </div>
        <div class="form-group">
            <label for="nivel">Nivel del Pokemon:</label>
            <input type="number" id="nivel" name="nivel" required>
        </div>
        <div class="form-group">
            <label for="ataque">Ataque del Pokemon:</label>
            <input type="number" id="ataque" name="ataque" required>
        </div>
        <div class="form-group">
            <label for="defensa">Defensa del Pokemon:</label>
            <input type="number" id="defensa" name="defensa" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Guardar Pokemon</button>
    </form>

    <a href="/pokemons" class="back-link">← Volver a la lista de pokemons</a>
</div>
{% endblock %}
